<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <link rel="icon" href="/favicon.svg" />
    <title>Crescent Lake · Portrait Review</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        background: #202522;
        display: grid;
        place-content: center;
        padding: 20px;
        font:
          11px Arial,
          sans-serif;
        color: #c5cdbf;
      }
      main {
        width: min(540px, calc((100vh - 65px) * .5625), calc(100vw - 40px));
      }
      .review-note {
        display: flex;
        justify-content: space-between;
        letter-spacing: 1.3px;
        margin: 0 0 12px;
      }
      .frame {
        position: relative;
        width: 100%;
        aspect-ratio: 9/16;
        box-shadow: 0 12px 60px #0005;
      }
      iframe {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        border: 0;
        background: #f4f3e9;
      }
      a {
        color: inherit;
      }
    </style>
  </head>
  <body>
    <main>
      <p class="review-note">
        <span>PORTRAIT REVIEW</span><span>9:16 / LIVE SCENE</span>
      </p>
      <div class="frame">
        <iframe
          src="./"
          title="Portrait lake preview"
          allow="autoplay"
        ></iframe>
      </div>
    </main>
  </body>
</html>
